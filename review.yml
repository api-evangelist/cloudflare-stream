sources:
  - url: https://developers.cloudflare.com/stream/
    type: Documentation
    note: Cloudflare Stream product docs. All programmatic control is REST over HTTPS.
  - url: https://developers.cloudflare.com/api/resources/stream/
    type: APIReference
    note: Core video endpoints under /accounts/{account_id}/stream. Bearer auth, base api.cloudflare.com/client/v4.
  - url: https://developers.cloudflare.com/api/resources/stream/subresources/live_inputs/
    type: APIReference
    note: Live inputs and simulcast outputs CRUD. RTMPS/SRT ingest, not WebSocket.
  - url: https://developers.cloudflare.com/api/resources/stream/subresources/captions/
    type: APIReference
    note: Captions CRUD plus AI generate and WebVTT retrieval, keyed by BCP 47 language.
  - url: https://developers.cloudflare.com/stream/viewing-videos/securing-your-stream/
    type: Documentation
    note: Signing keys under /stream/keys and per-video signed tokens via POST /stream/{identifier}/token.
  - url: https://developers.cloudflare.com/stream/manage-video-library/using-webhooks/
    type: Documentation
    note: Single per-account webhook (PUT/GET/DELETE /stream/webhook) POSTs a signed notification. Outbound HTTP, not WebSocket.
  - url: https://developers.cloudflare.com/stream/pricing/
    type: Pricing
    note: 5 USD per 1,000 minutes stored, 1 USD per 1,000 minutes delivered.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Cloudflare Stream's own API. The
    control plane is request/response REST, the only push mechanism is an outbound
    HTTP webhook, and the media transports (RTMPS, SRT, HLS, DASH, WebRTC WHIP/WHEP)
    are streaming media protocols rather than a client WebSocket messaging API. No
    AsyncAPI document was created because there is no documented bidirectional
    WebSocket transport on Stream's own API to model.
