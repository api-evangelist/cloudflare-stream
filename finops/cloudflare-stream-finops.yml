description: >-
  FinOps view of Cloudflare Stream spend. Stream bills on two usage dimensions with
  no per-request API fee: storage at 5 USD per 1,000 minutes of video stored
  (prepaid, in increments) and delivery at 1 USD per 1,000 minutes delivered
  (post-paid, on minutes watched). Encoding, the built-in player, and HLS/DASH
  delivery are included. Live and on-demand share the same model, so the primary
  cost drivers are how many minutes you retain in the library and how many minutes
  viewers actually watch. Committed-volume Enterprise agreements offer negotiated
  rates. A related Media Transformations feature bills separately per unique
  transformation operation.
notes: >-
  Per-unit rates are grounded from the Cloudflare Stream pricing page as of the
  review date. The dominant, most variable cost is delivery (minutes watched);
  storage is a more predictable prepaid line. Verify current rates on the pricing
  page during reconciliation.
