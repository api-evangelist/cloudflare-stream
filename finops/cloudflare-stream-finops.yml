principles:
- name: Visibility
  description: Track minutes stored and minutes delivered per video; delivery (minutes watched) is the most variable line and should be monitored by video and audience.
- name: Allocation
  description: Tag or name videos and live inputs per workload or team so stored and delivered minutes map to internal cost centers.
- name: Optimization
  description: Delete or expire unused recordings to cut storage; use signed URLs and allowed origins to prevent unwanted delivery; right-size retention of live recordings.
- name: Accountability
  description: Assign owners per video library or live channel and review monthly stored and delivered minutes against budget and any Enterprise commitment.
