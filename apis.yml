- aid: cloudflare-stream:cloudflare-stream-signed-urls-api
  name: Cloudflare Stream Signed URLs API
  tags:
  - Signed URLs
  - Access Control
  - Security
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.cloudflare.com/stream/viewing-videos/securing-your-stream/
  baseURL: https://api.cloudflare.com/client/v4
  properties:
  - url: https://developers.cloudflare.com/stream/viewing-videos/securing-your-stream/
    type: Documentation
  - url: https://developers.cloudflare.com/api/resources/stream/subresources/keys/
    type: APIReference
  - url: openapi/cloudflare-stream-openapi.yml
    type: OpenAPI
  - url: collections/cloudflare-stream.postman_collection.json
    type: PostmanCollection
  - url: collections/cloudflare-stream.opencollection.json
    type: OpenCollection
  description: Restrict playback with signed URLs. Create and revoke RSA signing keys
    (up to 1,000 per account) under /accounts/{account_id}/stream/keys, and mint
    per-video signed tokens via POST /accounts/{account_id}/stream/{identifier}/token
    with configurable expiry and access rules.
