aid: cloudflare-stream
url: https://raw.githubusercontent.com/api-evangelist/cloudflare-stream/refs/heads/main/apis.yml
name: Cloudflare Stream
kind: company
description: Cloudflare Stream is the video streaming, hosting, and live-video product
  from Cloudflare - a single REST API for uploading, storing, encoding, and delivering
  on-demand and live video across Cloudflare's global network. It handles direct and
  TUS resumable uploads, copy-from-URL ingest, live inputs over RTMPS and SRT (with
  simulcast outputs and WebRTC/WHIP/WHEP beta), a built-in adaptive-bitrate player
  and HLS/DASH manifests, AI-generated and uploaded captions, signed-URL access
  control, per-account webhooks, and viewing analytics. This entry documents the
  Cloudflare Stream product specifically, not the broader Cloudflare platform. The
  API is served under https://api.cloudflare.com/client/v4/accounts/{account_id}/stream
  and authenticates with a Bearer API token. Billed at $5 per 1,000 minutes of video
  stored and $1 per 1,000 minutes delivered.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Video
